<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Control Center</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: #e7e1d6;
        font-family: "Hiragino Sans", "PingFang SC", system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      #scene-host {
        width: max-content;
        height: max-content;
        position: relative;
      }
      #scene-host .boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        font-size: 13px;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div id="scene-host">
      <div class="boot">加载 Home…</div>
    </div>
    <script type="module">
      import { Control, events } from "./mygo.js";
      import { mountMarketScene, mountScene, mountSceneURL } from "./scene-host.js";

      const host = document.getElementById("scene-host");
      const api = { Control, events };
      let loading = 0;

      function fail(err) {
        host.replaceChildren();
        const box = document.createElement("div");
        box.className = "boot";
        box.textContent = "场景加载失败：" + String(err && err.message ? err.message : err);
        host.appendChild(box);
        console.error(err);
      }

      // Mount the selected scene; fall back to the bundled Home if the bridge
      // or the saved HTML is unusable.
      async function load() {
        const ticket = ++loading;
        try {
          const scene = await Control.currentScene();
          if (ticket !== loading) return;
          if (scene.marketId) mountMarketScene(host, scene.html, api);
          else await mountScene(host, scene.html, api);
        } catch (err) {
          if (ticket !== loading) return;
          console.error(err);
          try {
            await mountSceneURL(host, "./scenes/home.html", api);
          } catch (inner) {
            fail(inner);
          }
        }
      }

      // The scene decides the flyout size: report what it measures.
      let lastSize = "";
      new ResizeObserver(() => {
        const w = Math.round(host.offsetWidth);
        const h = Math.round(host.offsetHeight);
        const key = w + "x" + h;
        if (key === lastSize || w < 1 || h < 1) return;
        lastSize = key;
        Control.setFlyoutSize(w, h).catch(() => {});
      }).observe(host);

      events.scenesChanged.on(load);
      load();
    </script>
  </body>
</html>
