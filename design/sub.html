<!-- Deep-Sea Submarine — the hull pings into the dark; louder means the sea
     answers more often.

     Interaction:
       拖动 X   -> 音量。声呐脉冲的节奏：越响，水里的同心圆越密
       拖动 Y   -> 内建亮度。探照灯的开度，决定能照多远
       轻点     -> 静音。声呐停摆，只剩海水自己流过

     Design draft: binds window.Control when the app injects it, falls back
     to a stand-in otherwise so the page opens in a browser tab. -->
<div class="sub" id="sub">
  <canvas class="stage" aria-hidden="true"></canvas>
  <div class="pad" id="pad" tabindex="0" role="application" aria-label="音量与亮度"></div>
  <div class="hint" id="hint"><span>横向调速 · 纵向开灯</span><i></i><span>轻点静默</span></div>
  <div class="hud">
    <div class="readout" id="readVol">
      <span class="k">VOL</span><span class="v" id="volText">0</span>
      <span class="unit">%</span>
      <span class="ping" id="pingText">PING</span>
    </div>
    <div class="readout" id="readBri">
      <span class="k">BRI</span><span class="v" id="briText">0</span>
      <span class="unit">%</span>
    </div>
  </div>
</div>

<style>
  .sub {
    position: relative;
    width: 460px;
    height: 560px;
    overflow: hidden;
    border-radius: 18px;
    background: #04121a;
    font-family: "Hiragino Sans", "PingFang SC", system-ui, sans-serif;
    color: #d7f2e6;
    user-select: none;
    -webkit-user-select: none;
    isolation: isolate;
  }
  .sub .stage {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .sub .pad {
    position: absolute;
    inset: 0;
    cursor: crosshair;
    touch-action: none;
    outline: none;
  }
  .sub .pad.dragging { cursor: grabbing; }
  .sub .pad:focus-visible {
    box-shadow: inset 0 0 0 1.5px rgba(140, 226, 196, 0.45);
    border-radius: 18px;
  }
  .sub .hud {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 13px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    pointer-events: none;
    transition: opacity 300ms ease-out, transform 300ms ease-out;
  }
  .sub .readout {
    display: flex;
    align-items: baseline;
    gap: 3px;
    transition: opacity 220ms ease-out;
  }
  .sub .readout .k {
    font-size: 9px;
    letter-spacing: 0.14em;
    font-weight: 700;
    color: rgba(190, 236, 216, 0.55);
  }
  .sub .readout .v {
    font-size: 15px;
    line-height: 1;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: #ecfff7;
    min-width: 2.1ch;
    text-align: right;
  }
  .sub .readout .unit {
    font-size: 9px;
    color: rgba(190, 236, 216, 0.4);
  }
  .sub .readout .ping {
    font-size: 8px;
    letter-spacing: 0.16em;
    font-weight: 700;
    margin-left: 5px;
    padding: 2px 4px 1px;
    border-radius: 3px;
    color: #8ff0c0;
    background: rgba(143, 240, 192, 0.13);
    transition: opacity 180ms ease-out;
  }
  .sub .readout .ping.dead {
    color: rgba(255, 148, 132, 0.85);
    background: rgba(255, 120, 100, 0.14);
  }
  .sub .readout.off .v,
  .sub .readout.off .k { color: rgba(190, 236, 216, 0.28); }
  .sub .hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 41px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 10px;
    color: rgba(190, 236, 216, 0.45);
    pointer-events: none;
    transition: opacity 800ms ease-out;
  }
  .sub .hint i {
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: currentColor;
  }
  .sub .hint.gone { opacity: 0; }
  .sub.short .hud { opacity: 0; transform: translateY(6px); }
  .sub.short .hint { opacity: 0; }
</style>

<script>
  (() => {
    "use strict";

    const W = 460;
    const H = 560;
    const LAMP = { x: 230, y: 486 };

    const root = document.getElementById("sub");
    const canvas = root.querySelector("canvas");
    const pad = document.getElementById("pad");
    const hint = document.getElementById("hint");
    const volText = document.getElementById("volText");
    const briText = document.getElementById("briText");
    const pingText = document.getElementById("pingText");
    const readBri = document.getElementById("readBri");

    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const smooth = (t) => t * t * (3 - 2 * t);

    // ---------------------------------------------------------------- bridge
    const live = typeof window.Control === "object" && window.Control !== null;
    const safe = (fn) => {
      try {
        const p = fn();
        if (p && typeof p.catch === "function") p.catch(() => {});
      } catch (_) {}
    };

    let volume = live ? 0 : 72;
    let brightness = live ? 0 : 58;
    let brightAvailable = true;
    let muted = false;

    const shown = { vol: volume / 100, bri: brightness / 100, mute: 0 };
    const target = { vol: volume / 100, bri: brightness / 100, mute: 0 };

    // ------------------------------------------------------------- rendering
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    const g = canvas.getContext("2d");
    g.scale(dpr, dpr);

    const grain = (() => {
      const n = document.createElement("canvas");
      n.width = n.height = 96;
      const ng = n.getContext("2d");
      const img = ng.createImageData(96, 96);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = 128 + (Math.random() - 0.5) * 40;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 14;
      }
      ng.putImageData(img, 0, 0);
      return n;
    })();

    const grainPattern = g.createPattern(grain, "repeat");

    // Colours travel as [r,g,b] triples internally so they can be mixed any
    // number of times; only the draw call turns them into CSS strings.
    function toRgb(c) {
      if (Array.isArray(c)) return c;
      if (c[0] === "#") {
        return [
          parseInt(c.slice(1, 3), 16),
          parseInt(c.slice(3, 5), 16),
          parseInt(c.slice(5, 7), 16),
        ];
      }
      const m = String(c).match(/(-?[\d.]+)/g);
      return m ? [Number(m[0]), Number(m[1]), Number(m[2])] : [0, 0, 0];
    }

    function mixColor(a, b, t) {
      const pa = toRgb(a);
      const pb = toRgb(b);
      const k = clamp(t, 0, 1);
      return [
        lerp(pa[0], pb[0], k),
        lerp(pa[1], pb[1], k),
        lerp(pa[2], pb[2], k),
      ];
    }

    function css(c, alpha) {
      const p = toRgb(c);
      return alpha === undefined
        ? `rgb(${Math.round(p[0])},${Math.round(p[1])},${Math.round(p[2])})`
        : `rgba(${Math.round(p[0])},${Math.round(p[1])},${Math.round(p[2])},${alpha})`;
    }

    // ------------------------------------------------------------- the water
    function waterColors(b) {
      // 0 -> the lamp is off and the water is nearly black
      return {
        top: css(mixColor("#030b12", "#1a6477", smooth(b))),
        mid: css(mixColor("#020910", "#0c3a48", smooth(b))),
        bot: css(mixColor("#010408", "#051c25", smooth(b))),
      };
    }

    const SNOW = [];
    for (let i = 0; i < 110; i++) {
      SNOW.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.4 + Math.random() * 1.1,
        s: 3 + Math.random() * 11,
        p: Math.random() * 6.283,
        a: 0.2 + Math.random() * 0.5,
      });
    }

    const FISH = [];
    for (let i = 0; i < 18; i++) {
      const dir = Math.random() < 0.5 ? -1 : 1;
      FISH.push({
        x: Math.random() * W,
        y: 80 + Math.random() * 300,
        dir,
        sp: 9 + Math.random() * 20,
        len: 9 + Math.random() * 12,
        p: Math.random() * 6.283,
        bob: 2 + Math.random() * 4,
        bio: Math.random() < 0.28,
      });
    }

    // Kelp beds, rooted below the hull line.
    const KELP = [];
    for (let i = 0; i < 16; i++) {
      const x = i < 8 ? 6 + Math.random() * 120 : 334 + Math.random() * 120;
      KELP.push({
        x,
        h: 60 + Math.random() * 120,
        w: 2 + Math.random() * 3,
        p: Math.random() * 6.283,
        lean: (Math.random() - 0.5) * 0.5,
      });
    }

    const JELLY = [];
    for (let i = 0; i < 3; i++) {
      JELLY.push({
        x: 70 + i * 110 + Math.random() * 30,
        y: 70 + Math.random() * 90,
        r: 11 + Math.random() * 6,
        p: Math.random() * 6.283,
        drift: (Math.random() - 0.5) * 6,
      });
    }

    const BUBBLES = [];
    for (let i = 0; i < 14; i++) {
      BUBBLES.push({
        x: 40 + Math.random() * 280,
        y: 300 + Math.random() * 60,
        r: 1.2 + Math.random() * 2.4,
        s: 14 + Math.random() * 22,
        p: Math.random() * 6.283,
      });
    }

    const rings = [];

    function drawWater(b) {
      const c = waterColors(b);
      const water = g.createLinearGradient(0, 0, 0, H);
      water.addColorStop(0, c.top);
      water.addColorStop(0.42, c.mid);
      water.addColorStop(1, c.bot);
      g.fillStyle = water;
      g.fillRect(0, 0, W, H);

      // the surface, far above: a band of light that brightness opens up
      const surf = g.createLinearGradient(0, 0, 0, 96);
      surf.addColorStop(0, css(mixColor("#081726", "#a8e6e0", 0.18 + b * 0.6), 0.10 + b * 0.55));
      surf.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = surf;
      g.fillRect(0, 0, W, 96);
    }

    function drawCaustics(b, t) {
      if (b < 0.05) return;
      g.save();
      g.globalCompositeOperation = "lighter";
      g.strokeStyle = css(mixColor("#2f7f8a", "#b8ffee", b), 0.05 + b * 0.1);
      g.lineWidth = 1.2;
      for (let k = 0; k < 6; k++) {
        const y0 = 8 + k * 13;
        g.beginPath();
        for (let x = -10; x <= W + 10; x += 12) {
          const y = y0 + Math.sin(x * 0.028 + t * 0.5 + k * 1.7) * (3 + k * 0.7);
          if (x < 0) g.moveTo(x, y);
          else g.lineTo(x, y);
        }
        g.stroke();
      }
      g.restore();
    }

    function drawFar(b) {
      // A rock arch off to the right and a broken wreck to the left. Both are
      // silhouettes; the searchlight is what makes them readable.
      const lit = 0.3 + b * 0.7;

      g.save();
      g.fillStyle = css(mixColor("#020a10", "#123a44", lit), 0.9);
      g.beginPath();
      g.moveTo(300, 470);
      g.bezierCurveTo(320, 360, 370, 300, 440, 286);
      g.lineTo(W, 292);
      g.lineTo(W, 470);
      g.closePath();
      g.fill();
      // the hole in the arch
      g.fillStyle = css(mixColor("#020910", "#0d3f4d", lit), 0.55);
      g.beginPath();
      g.ellipse(396, 378, 22, 32, -0.22, 0, 6.284);
      g.fill();
      g.restore();

      g.save();
      g.fillStyle = css(mixColor("#01070c", "#0e3640", lit), 0.75);
      g.beginPath();
      g.moveTo(-10, 470);
      g.lineTo(8, 404);
      g.lineTo(54, 390);
      g.lineTo(98, 408);
      g.lineTo(122, 470);
      g.closePath();
      g.fill();
      g.restore();
    }

    function drawKelp(b, t) {
      const near = css(mixColor("#020a0c", "#0d3a33", 0.25 + b * 0.5));
      g.save();
      g.lineCap = "round";
      for (const k of KELP) {
        g.strokeStyle = near;
        g.lineWidth = k.w;
        g.beginPath();
        g.moveTo(k.x, H);
        for (let s = 1; s <= 5; s++) {
          const f = s / 5;
          const sway = Math.sin(t * 0.55 + k.p + f * 1.5) * 9 * f;
          g.lineTo(k.x + k.lean * f * 26 + sway, H - k.h * f);
        }
        g.stroke();
      }
      g.restore();
    }

    function drawSnow(b, t) {
      g.save();
      for (const s of SNOW) {
        s.y += s.s * 0.016;
        if (s.y > H) {
          s.y = -4;
          s.x = Math.random() * W;
        }
        const x = s.x + Math.sin(t * 0.3 + s.p) * 4;
        g.fillStyle = `rgba(190,255,240,${s.a * (0.18 + b * 0.5)})`;
        g.beginPath();
        g.arc(x, s.y, s.r, 0, 6.284);
        g.fill();
      }
      g.restore();
    }

    function drawBeam(b, t) {
      if (b < 0.02) return;
      const len = lerp(96, 430, b);
      const half = lerp(0.15, 0.52, b);
      const sway = Math.sin(t * 0.28) * 0.03;

      // A cone is a fan of points around the lamp, not an arc call: sampling
      // the edge keeps the wedge exactly as wide as `half` says.
      const cone = (spread, reach, alpha) => {
        g.beginPath();
        g.moveTo(LAMP.x, LAMP.y);
        for (let i = 0; i <= 20; i++) {
          const a = sway + spread * (i / 10 - 1);
          g.lineTo(
            LAMP.x + Math.sin(a) * reach,
            LAMP.y - Math.cos(a) * reach
          );
        }
        g.closePath();
        const grd = g.createRadialGradient(LAMP.x, LAMP.y, 4, LAMP.x, LAMP.y, reach);
        grd.addColorStop(0, css("#fff4cf", alpha * 1.4));
        grd.addColorStop(0.4, css("#c8eecb", alpha * 0.62));
        grd.addColorStop(1, "rgba(150,220,200,0)");
        g.fillStyle = grd;
        g.fill();
      };

      g.save();
      g.globalCompositeOperation = "lighter";
      cone(half, len, 0.09 + b * 0.11);
      cone(half * 0.46, len * 0.9, 0.09 + b * 0.13);

      // the lamp itself
      const hot = g.createRadialGradient(LAMP.x, LAMP.y - 2, 0, LAMP.x, LAMP.y - 2, 22 + b * 20);
      hot.addColorStop(0, css("#fffbe8", 0.5 + b * 0.45));
      hot.addColorStop(0.4, css("#ffe2a0", 0.22 + b * 0.2));
      hot.addColorStop(1, "rgba(255,220,150,0)");
      g.fillStyle = hot;
      g.beginPath();
      g.arc(LAMP.x, LAMP.y - 2, 22 + b * 20, 0, 6.284);
      g.fill();
      g.restore();
    }

    function inBeam(x, y, b) {
      if (b < 0.03) return 0;
      const dx = x - LAMP.x;
      const dy = LAMP.y - y;
      if (dy <= 0) return 0;
      const len = lerp(96, 430, b);
      const d = Math.hypot(dx, dy);
      if (d > len) return 0;
      const ang = Math.abs(Math.atan2(dx, dy));
      const half = lerp(0.15, 0.52, b);
      const t = 1 - ang / half;
      return clamp(t, 0, 1) * clamp(1 - d / len, 0, 1) * (0.35 + b * 0.65);
    }

    function fishPath(x, y, len, dir) {
      const h = len * 0.36;
      g.beginPath();
      g.moveTo(x + dir * len * 0.5, y);
      g.quadraticCurveTo(x + dir * len * 0.05, y - h, x - dir * len * 0.3, y - h * 0.16);
      g.lineTo(x - dir * len * 0.62, y - h * 0.8);
      g.lineTo(x - dir * len * 0.62, y + h * 0.8);
      g.lineTo(x - dir * len * 0.3, y + h * 0.16);
      g.quadraticCurveTo(x + dir * len * 0.05, y + h, x + dir * len * 0.5, y);
      g.closePath();
    }

    function drawFish(b, t, dt) {
      for (const f of FISH) {
        f.x += f.dir * f.sp * dt;
        if (f.x < -30) {
          f.x = W + 30;
          f.y = 80 + Math.random() * 300;
        } else if (f.x > W + 30) {
          f.x = -30;
          f.y = 80 + Math.random() * 300;
        }
        const y = f.y + Math.sin(t * 1.4 + f.p) * f.bob;
        const glow = inBeam(f.x, y, b);

        if (glow > 0.02) {
          g.fillStyle = css(mixColor("#4f8f96", "#ffe6b4", glow), 0.35 + glow * 0.65);
        } else {
          g.fillStyle = css(mixColor("#02131a", "#0a2c34", 0.3), 0.85);
        }
        fishPath(f.x, y, f.len, f.dir);
        g.fill();

        if (glow > 0.2) {
          g.fillStyle = `rgba(40,60,60,${glow * 0.7})`;
          g.beginPath();
          g.arc(f.x + f.dir * f.len * 0.26, y - f.len * 0.04, f.len * 0.055, 0, 6.284);
          g.fill();
        }

        if (f.bio) {
          // a bioluminescent bead: the only thing visible with the lamp off
          const pulse = 0.45 + 0.55 * Math.sin(t * 2 + f.p);
          g.fillStyle = css("#7cf9d2", (0.18 + b * 0.1) * pulse + 0.22);
          g.beginPath();
          g.arc(f.x - f.dir * f.len * 0.42, y + f.len * 0.1, f.len * 0.1, 0, 6.284);
          g.fill();
        }
      }
    }

    let ringTimer = 0;

    function stepRings(dt, v, alive) {
      const interval = lerp(1.55, 0.2, smooth(v));
      ringTimer -= dt * alive;
      if (ringTimer <= 0) {
        ringTimer += interval;
        if (alive > 0.15 && v > 0.005) {
          rings.push({ r: 8, life: 1, v });
        }
      }
      if (ringTimer < -2) ringTimer = 0;

      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        r.r += dt * (108 + r.v * 190) * (0.4 + alive * 0.6);
        r.life -= dt * (0.62 - r.v * 0.2) * (1.4 - alive * 0.4);
        if (r.life <= 0) rings.splice(i, 1);
      }
    }

    function drawRings(alive) {
      if (!rings.length) return;
      g.save();
      g.globalCompositeOperation = "lighter";
      for (const r of rings) {
        const a = r.life * r.life * (0.16 + r.v * 0.5) * alive;
        if (a < 0.004) continue;
        g.strokeStyle = `rgba(143,240,192,${a})`;
        g.lineWidth = 0.8 + r.life * 1.6;
        g.beginPath();
        g.arc(LAMP.x, LAMP.y - 6, r.r, 0, 6.284);
        g.stroke();
        // the trailing echo, a second faint band just inside
        if (r.v > 0.25) {
          g.strokeStyle = `rgba(143,240,192,${a * 0.4})`;
          g.lineWidth = 0.7;
          g.beginPath();
          g.arc(LAMP.x, LAMP.y - 6, r.r * 0.82, 0, 6.284);
          g.stroke();
        }
      }
      g.restore();
    }

    function drawJelly(b, t) {
      g.save();
      for (const j of JELLY) {
        const y = j.y + Math.sin(t * 0.6 + j.p) * 8;
        const x = j.x + j.drift * Math.sin(t * 0.25 + j.p);
        const pulse = 0.55 + 0.45 * Math.sin(t * 1.6 + j.p);
        const glow = inBeam(x, y, b);

        // trailing tentacles, drawn first so the bell sits on top
        g.strokeStyle = css("#9af0d4", 0.16 + glow * 0.35);
        g.lineWidth = 1;
        for (let k = -2; k <= 2; k++) {
          g.beginPath();
          g.moveTo(x + k * j.r * 0.28, y + j.r * 0.35);
          g.quadraticCurveTo(
            x + k * j.r * 0.5 + Math.sin(t * 1.1 + j.p + k) * 3,
            y + j.r * 1.3,
            x + k * j.r * 0.34,
            y + j.r * (2.1 + Math.abs(k) * 0.25)
          );
          g.stroke();
        }

        // the bell
        g.fillStyle = css(mixColor("#1a4a4a", "#c8fff0", 0.15 + glow * 0.7), 0.28 + glow * 0.35);
        g.beginPath();
        g.arc(x, y, j.r, Math.PI, 0);
        g.quadraticCurveTo(x + j.r * 0.7, y + j.r * 0.55, x, y + j.r * 0.42);
        g.quadraticCurveTo(x - j.r * 0.7, y + j.r * 0.55, x - j.r, y);
        g.fill();

        // inner glow, the thing you can still see when the lamp is off
        g.fillStyle = css("#b6ffe6", (0.10 + pulse * 0.16) * (0.6 + glow));
        g.beginPath();
        g.ellipse(x, y - j.r * 0.15, j.r * 0.55, j.r * 0.34, 0, 0, 6.284);
        g.fill();
      }
      g.restore();
    }

    function drawBubbles(b, t, dt) {
      g.save();
      g.lineWidth = 1;
      for (const u of BUBBLES) {
        u.y -= u.s * dt;
        if (u.y < -6) {
          u.y = 300 + Math.random() * 40;
          u.x = 40 + Math.random() * 280;
        }
        const x = u.x + Math.sin(t * 0.8 + u.p) * 3;
        const glow = inBeam(x, u.y, b);
        g.strokeStyle = css("#d8fff2", 0.18 + glow * 0.5);
        g.beginPath();
        g.arc(x, u.y, u.r, 0, 6.284);
        g.stroke();
        g.fillStyle = css("#ffffff", 0.25 + glow * 0.4);
        g.beginPath();
        g.arc(x - u.r * 0.3, u.y - u.r * 0.3, u.r * 0.28, 0, 6.284);
        g.fill();
      }
      g.restore();
    }

    function drawHull(b, t) {
      // The boat we are standing in: a dark bow across the bottom, with the
      // lamp housing on top of it. Everything below is the sub, not the sea.
      const lit = 0.4 + b * 0.6;

      g.save();
      g.fillStyle = css(mixColor("#050f12", "#123a38", lit * 0.9));
      g.beginPath();
      g.moveTo(-10, H + 8);
      g.lineTo(-10, 524);
      g.bezierCurveTo(90, 506, 166, 492, 230, 491);
      g.bezierCurveTo(294, 492, 372, 506, 470, 524);
      g.lineTo(470, H + 8);
      g.closePath();
      g.fill();

      // a verdigris highlight along the top edge of the hull
      g.strokeStyle = css(mixColor("#0a1c1e", "#4f9a8c", lit), 0.5);
      g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(-10, 524);
      g.bezierCurveTo(90, 506, 166, 492, 230, 491);
      g.bezierCurveTo(294, 492, 372, 506, 470, 524);
      g.stroke();

      // rivets
      g.fillStyle = css(mixColor("#081618", "#3d7d72", lit), 0.55);
      for (let i = 0; i < 14; i++) {
        const x = 18 + i * 32;
        const y = 516 - Math.abs(x - 230) * 0.05 - Math.sin((x / W) * Math.PI) * 12;
        g.beginPath();
        g.arc(x, y, 1.5, 0, 6.284);
        g.fill();
      }

      // lamp housing
      g.fillStyle = css(mixColor("#0a1a16", "#6d8f6a", lit * 0.85));
      g.beginPath();
      g.moveTo(LAMP.x - 15, 506);
      g.lineTo(LAMP.x - 9, 488);
      g.lineTo(LAMP.x + 9, 488);
      g.lineTo(LAMP.x + 15, 506);
      g.closePath();
      g.fill();
      g.fillStyle = css(mixColor("#14251f", "#c9a768", lit), 0.9);
      g.beginPath();
      g.ellipse(LAMP.x, 488, 9, 3.4, 0, 0, 6.284);
      g.fill();
      g.restore();

      // a thin brass ring around the lamp, not a frame over the whole view
      g.save();
      g.strokeStyle = css(mixColor("#0c2420", "#8fd0bc", lit), 0.4);
      g.lineWidth = 1.5;
      g.beginPath();
      g.arc(LAMP.x, LAMP.y - 6, 34, 0, 6.284);
      g.stroke();
      g.restore();
    }

    function drawGrain(b) {
      g.save();
      g.globalAlpha = 0.55;
      g.fillStyle = grainPattern;
      g.fillRect(0, 0, W, H);
      g.restore();

      const vig = g.createRadialGradient(W / 2, H * 0.4, H * 0.24, W / 2, H * 0.52, H * 0.86);
      vig.addColorStop(0, "rgba(0,0,0,0)");
      vig.addColorStop(1, `rgba(0,6,10,${0.46 - b * 0.16})`);
      g.fillStyle = vig;
      g.fillRect(0, 0, W, H);

      if (b < 0.4) {
        g.fillStyle = `rgba(4,20,30,${(0.4 - b) * 0.4})`;
        g.fillRect(0, 0, W, H);
      }
    }

    // ------------------------------------------------------------ interaction
    let dragging = false;
    let downAt = 0;
    let moved = 0;
    let downX = 0;
    let downY = 0;

    const queue = { vol: null, bri: null };
    let sendTimer = 0;

    function flush() {
      sendTimer = 0;
      if (!live) return;
      if (queue.vol !== null) {
        const v = queue.vol;
        queue.vol = null;
        safe(() => window.Control.setVolume(v));
      }
      if (queue.bri !== null) {
        const b = queue.bri;
        queue.bri = null;
        if (brightAvailable) safe(() => window.Control.setBrightness(b));
      }
    }

    function queueSend() {
      if (!live) return;
      if (!sendTimer) sendTimer = setTimeout(flush, 60);
    }

    function paintHud() {
      volText.textContent = String(volume);
      briText.textContent = brightAvailable ? String(brightness) : "—";
      pingText.textContent = muted ? "MUTE" : "PING";
      pingText.classList.toggle("dead", muted);
      readBri.classList.toggle("off", !brightAvailable);
    }

    function setVolumeFromX(cx) {
      const r = pad.getBoundingClientRect();
      const inset = 18;
      const xn = clamp((cx - r.left - inset) / Math.max(1, r.width - inset * 2), 0, 1);
      const v = Math.round(xn * 100);
      if (v !== volume) {
        volume = v;
        target.vol = volume / 100;
        if (live && volume > 0 && muted) {
          muted = false;
          target.mute = 0;
        }
        queue.vol = volume;
        queueSend();
        paintHud();
      }
    }

    function setBrightnessFromY(cy) {
      if (!brightAvailable) return;
      const r = pad.getBoundingClientRect();
      const inset = 18;
      const yn = clamp((cy - r.top - inset) / Math.max(1, r.height - inset * 2), 0, 1);
      const b = Math.round((1 - yn) * 100);
      if (b !== brightness) {
        brightness = b;
        target.bri = brightness / 100;
        queue.bri = brightness;
        queueSend();
        paintHud();
      }
    }

    function toggleMute() {
      muted = !muted;
      target.mute = muted ? 1 : 0;
      if (live) safe(() => window.Control.setMute(muted));
      paintHud();
      dismissHint();
    }

    function dismissHint() {
      hint.classList.add("gone");
    }

    pad.addEventListener("pointerdown", (e) => {
      dragging = true;
      moved = 0;
      downAt = performance.now();
      downX = e.clientX;
      downY = e.clientY;
      pad.classList.add("dragging");
      try {
        pad.setPointerCapture(e.pointerId);
      } catch (_) {}
      safe(() => window.Control && window.Control.noteDrag(true));
      setVolumeFromX(e.clientX);
      setBrightnessFromY(e.clientY);
      dismissHint();
    });

    pad.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      moved = Math.max(moved, Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY));
      setVolumeFromX(e.clientX);
      setBrightnessFromY(e.clientY);
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      pad.classList.remove("dragging");
      flush();
      if (moved < 6 && performance.now() - downAt < 320) toggleMute();
      safe(() => window.Control && window.Control.noteDrag(false));
      safe(() => window.Control && window.Control.noteIdle());
      paintHud();
    }

    pad.addEventListener("pointerup", endDrag);
    pad.addEventListener("pointercancel", endDrag);
    pad.addEventListener("lostpointercapture", endDrag);

    pad.addEventListener("keydown", (e) => {
      let handled = true;
      if (e.key === "ArrowLeft") {
        volume = clamp(volume - 5, 0, 100);
      } else if (e.key === "ArrowRight") {
        volume = clamp(volume + 5, 0, 100);
      } else if (e.key === "ArrowUp" && brightAvailable) {
        brightness = clamp(brightness + 5, 0, 100);
      } else if (e.key === "ArrowDown" && brightAvailable) {
        brightness = clamp(brightness - 5, 0, 100);
      } else if (e.key === " " || e.key === "Enter") {
        toggleMute();
      } else {
        handled = false;
      }
      if (handled) {
        e.preventDefault();
        target.vol = volume / 100;
        target.bri = brightness / 100;
        queue.vol = volume;
        if (brightAvailable) queue.bri = brightness;
        flush();
        paintHud();
        dismissHint();
      }
    });

    // ------------------------------------------------------------------ loop
    let last = performance.now();

    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      const t = now / 1000;

      const k = 1 - Math.pow(0.0025, dt);
      shown.vol = lerp(shown.vol, target.vol, k);
      shown.bri = lerp(shown.bri, target.bri, k);
      shown.mute = lerp(shown.mute, target.mute, k);

      const b = brightAvailable ? smooth(clamp(shown.bri, 0, 1)) : 0.55;
      const alive = 1 - shown.mute;

      stepRings(dt, shown.vol, alive);

      g.clearRect(0, 0, W, H);
      drawWater(b);
      drawCaustics(b, t);
      drawFar(b);
      drawKelp(b, t);
      drawBeam(b, t);
      drawFish(b, t, dt);
      drawJelly(b, t);
      drawBubbles(b, t, dt);
      drawRings(alive);
      drawSnow(b, t);
      drawHull(b, t);
      drawGrain(b);
    }

    // ------------------------------------------------------------------ boot
    function start() {
      paintHud();
      requestAnimationFrame(frame);
      setTimeout(dismissHint, 5200);
    }

    if (live) {
      window.Control.getState()
        .then((s) => {
          brightAvailable = !!s.brightnessAvailable;
          volume = Math.round(clamp(s.volume || 0, 0, 100));
          brightness = brightAvailable ? Math.round(clamp(s.brightness || 0, 0, 100)) : 0;
          target.vol = volume / 100;
          target.bri = brightness / 100;
          shown.vol = target.vol;
          shown.bri = target.bri;
          paintHud();
        })
        .catch(() => paintHud());

      if (window.events && window.events.stateChanged) {
        window.events.stateChanged.on((c) => {
          if (!c) return;
          if (typeof c.volume === "number") {
            volume = Math.round(clamp(c.volume, 0, 100));
            target.vol = volume / 100;
          }
          if (typeof c.brightness === "number" && brightAvailable) {
            brightness = Math.round(clamp(c.brightness, 0, 100));
            target.bri = brightness / 100;
          }
          paintHud();
        });
      }

      if (window.events && window.events.pillForm) {
        window.events.pillForm.on((p) => {
          const form = p && p.form;
          root.classList.toggle("short", form === "short");
        });
      }
    }

    start();
  })();
</script>
