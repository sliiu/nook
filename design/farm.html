<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>农场音量控制 清爽卡通版</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: transparent;
  }

  .scene {
    position: relative;
    width: 420px;
    background: #9ad8ff;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    touch-action: none;
  }

  /* ========== 天空背景 ========== */
  .sky {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    overflow: hidden;
    cursor: pointer;
  }

  .sky-drag {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    cursor: pointer;
  }

  .sky-layer {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    opacity: 0;
  }

  .sky-layer.morning {
    background: linear-gradient(180deg, #ffd8a8 0%, #ffe9c7 40%, #d7f1c7 100%);
    opacity: 1;
  }

  .sky-layer.day {
    background: linear-gradient(180deg, #9ad8ff 0%, #d7f1c7 70%, #a8dd8c 100%);
  }

  .sky-layer.evening {
    background: linear-gradient(180deg, #ffb37a 0%, #ffd6a5 40%, #d9aed6 70%, #8fa8d6 100%);
  }

  .sky-layer.night {
    background: linear-gradient(180deg, #0b1a3a 0%, #1c2f5a 50%, #2f4a7a 100%);
  }

  /* 太阳与月亮共用一条弧线，位置由脚本写 */
  .sun {
    position: absolute;
    top: 0;
    left: 0;
    width: 16%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fffbe0, #ffd24d 60%, #ff9a3c);
    box-shadow:
      0 0 60px rgba(255, 220, 120, 0.9),
      0 0 120px rgba(255, 180, 80, 0.6);
    pointer-events: none;
    z-index: 5;
    outline: 3px solid rgba(255, 255, 255, 0.85);
    outline-offset: -3px;
  }

  .sun:active {
    cursor: grabbing;
  }

  /* 月亮 */
  .moon {
    position: absolute;
    top: 0;
    left: 0;
    width: 14%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #dbeafe 70%, #93c5fd);
    box-shadow:
      0 0 50px rgba(200, 230, 255, 0.8),
      0 0 100px rgba(140, 180, 255, 0.5);
    opacity: 0;
    z-index: 4;
    pointer-events: none;
    outline: 3px solid rgba(255, 255, 255, 0.7);
    outline-offset: -3px;
  }

  /* 星星 */
  .stars {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    opacity: 0;
    pointer-events: none;
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2.4s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.3; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1.1); }
  }

  /* 云朵 */
  .cloud {
    position: absolute;
    font-size: 54px;
    line-height: 1;
    color: #fff;
    text-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    animation: cloudMove linear infinite;
    z-index: 1;
  }

  .cloud.c1 { top: 10%; left: -20%; animation-duration: 45s; }
  .cloud.c2 { top: 20%; left: -24%; font-size: 46px; animation-duration: 60s; animation-delay: -20s; }
  .cloud.c3 { top: 30%; left: -18%; font-size: 38px; animation-duration: 52s; animation-delay: -35s; }

  @keyframes cloudMove {
    from { transform: translateX(0); }
    to { transform: translateX(140vw); }
  }

  /* ========== 底部农场区域 ========== */
  .farm-area {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 60%;
    z-index: 1;
    overflow: hidden;
  }

  /* 农场草地底 */
  .farm-grass {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 100%;
    background: linear-gradient(180deg, #8fbf5b 0%, #6aa844 60%, #539434 100%);
    z-index: 1;
  }

  /* 田块承载底板 */
  .field-panel {
    position: absolute;
    left: 50%;
    bottom: 22%;
    width: 86%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #c8925a 0%, #a67c52 100%);
    border: 4px solid #5a3a1c;
    border-radius: 14px;
    box-shadow: inset 0 0 0 4px #e6b47a, 0 6px 12px rgba(0,0,0,0.2);
    padding: 6px;
    z-index: 2;
  }

  /* ========== 田地网格：每行5个 ========== */
  .field {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    z-index: 4;
  }

  .plot {
    aspect-ratio: 1 / 1;
    background: linear-gradient(180deg, #a67c52, #8b5a2b);
    border: 4px solid #5a3a1c;
    border-radius: 12px;
    box-shadow: inset 0 0 0 4px #c8925a, 0 4px 0 #5a3a1c;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 150ms ease-out;
  }

  @media (hover: hover) {
    .plot:hover { transform: translateY(-2px); }
  }
  .plot:active { transform: translateY(2px); }

  .plot::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 2px dashed rgba(255, 220, 180, 0.35);
    border-radius: 8px;
    pointer-events: none;
  }

  .plot.planted {
    background: linear-gradient(180deg, #7cc46a, #4a9b3a);
  }

  .crop-display {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    pointer-events: none;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.35));
  }

  /* ========== 左上控件 ========== */
  .farm-top-left {
    position: absolute;
    left: 10px;
    top: 32%;
    z-index: 8;
  }


  .global-seed-picker {
    background: linear-gradient(180deg, #f2c06b 0%, #d99a3a 100%);
    border: 4px solid #6b4423;
    border-radius: 14px;
    padding: 6px 8px;
    display: flex;
    gap: 5px;
    box-shadow: 0 4px 0 #6b4423;
    transition: filter 0.2s ease;
  }

  .global-seed-picker:hover { filter: brightness(1.04); }

  .seed-option {
    width: 28px;
    height: 28px;
    border-radius: 10px;
    background: #fff7d6;
    border: 3px solid #c77a1f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }

  .seed-option:hover { transform: scale(1.15); background: #ffd166; }
  .seed-option.selected { background: #9be77b; border-color: #2b7d20; }

  .scarecrow {
    position: absolute;
    right: 10px;
    top: 32%;
    z-index: 8;
    font-size: 44px;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.4s linear;
    filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.25));
  }

  .scarecrow:hover { transform: scale(1.08) rotate(-4deg); }
  .scarecrow-body { position: relative; display: inline-block; }

  .tape-x {
    position: absolute;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    width: 38px;
    height: 38px;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }

  .tape-x::before, .tape-x::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 38px;
    height: 6px;
    background: repeating-linear-gradient(45deg, #ffb3c6, #ffb3c6 6px, #ff6fa0 6px, #ff6fa0 12px);
    border: 2px solid #c7507a;
    border-radius: 4px;
    transform-origin: center;
  }

  .tape-x::before { transform: translate(-50%, -50%) rotate(45deg); }
  .tape-x::after  { transform: translate(-50%, -50%) rotate(-45deg); }
  .scarecrow.muted .tape-x { opacity: 1; }

  .mute-icon {
    position: absolute;
    left: 100%;
    top: 50%;
    margin-left: 8px;
    transform: translateY(-50%);
    background: #fff;
    border: 3px solid #4a3412;
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 12px;
    box-shadow: 0 4px 0 #4a3412;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.35s cubic-bezier(.3,1.6,.5,1);
    pointer-events: none;
    z-index: 3;
  }

  .scarecrow.muted .mute-icon { opacity: 1; }

  .scarecrow.shushing { animation: shush 0.9s ease; }
  @keyframes shush {
    0% { transform: scale(1) rotate(0); }
    30% { transform: scale(1.18) rotate(-10deg); }
    60% { transform: scale(0.92) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* ========== 状态栏、时间标签 ========== */
  .status-bar {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255, 255, 255, 0.58);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    padding: 8px 14px;
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: rgba(0, 0, 0, 0.72);
    z-index: 10;
    transition: background 0.4s linear, color 0.4s linear, border-color 0.4s linear;
  }

  .status-item { display: flex; align-items: center; gap: 6px; }

  /* 天气牌切外观：浅色、深色、自动 */
  .look-badge {
    position: absolute;
    top: 58px;
    right: 16px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.58);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    font-size: 12px;
    color: rgba(0, 0, 0, 0.72);
    cursor: pointer;
    transition: background 0.4s linear, color 0.4s linear, border-color 0.4s linear;
  }

  .look-badge:active { transform: scale(0.96); }

  .look-badge[hidden] { display: none; }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #30d158;
    box-shadow: 0 0 0 4px rgba(48, 209, 88, 0.2);
  }

  .time-label {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.58);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    padding: 8px 14px;
    font-size: 12px;
    color: rgba(0, 0, 0, 0.72);
    z-index: 10;
    transition: background 0.4s linear, color 0.4s linear, border-color 0.4s linear;
  }

  /* 一层月光，不要在地块上叠乘 brightness，否则作物会黑掉 */
  .night-veil {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 5;
    pointer-events: none;
    background: #0c1a3a;
    opacity: 0;
  }

  .night-mode .status-bar,
  .night-mode .time-label,
  .night-mode .look-badge {
    background: rgba(20, 30, 60, 0.55);
    color: rgba(255, 255, 255, 0.85);
    border-color: rgba(255, 255, 255, 0.18);
  }

  /* 田上一排：亮度、麦克风、收音机、Wi-Fi。本机没有的藏起来。 */
  .yard {
    position: absolute;
    top: calc(40% + 78% * 0.6 + 8px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    background: linear-gradient(180deg, #f2c06b 0%, #d99a3a 100%);
    border: 4px solid #6b4423;
    border-radius: 16px;
    box-shadow: 0 4px 0 #6b4423;
  }

  .yard[hidden],
  .yard-btn[hidden],
  .radio[hidden] { display: none; }

  .yard button {
    font: inherit;
    color: inherit;
    appearance: none;
    -webkit-appearance: none;
    padding: 0;
    cursor: pointer;
  }

  .yard-btn {
    width: 44px;
    height: 44px;
    border: 3px solid #6b4423;
    border-radius: 12px;
    background: #fff7d6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .yard-btn:active { transform: translateY(2px); }

  .lamp { box-shadow: 0 0 calc(var(--glow, 0) * 14px) rgba(255, 196, 60, var(--glow, 0)); }
  .lamp .glyph { font-size: 16px; }
  .lamp .pct { font-size: 9px; margin-top: 1px; color: #6b4423; }

  .chicken { font-size: 20px; }
  .chicken.muted { filter: grayscale(1); }
  .chicken.muted .glyph { position: relative; }
  .chicken.muted .glyph::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 3px;
    background: #c7507a;
    border-radius: 2px;
    transform: translate(-50%, -50%) rotate(-35deg);
  }

  .radio {
    display: flex;
    gap: 2px;
    padding: 3px;
    border-radius: 12px;
    background: #fff7d6;
    border: 3px solid #6b4423;
  }

  .radio button {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    font-size: 16px;
    line-height: 1;
  }

  .radio button:active,
  .radio button.tap { background: #9be77b; }

  .windmill .glyph {
    display: inline-block;
    font-size: 20px;
    line-height: 1;
  }

  .windmill.on .glyph { animation: mill 1.6s linear infinite; }
  .windmill:not(.on) { opacity: 0.5; }
  .windmill.shake { animation: refuse 0.35s ease; }

  @keyframes mill { to { transform: rotate(1turn); } }
  @keyframes refuse {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-4px); }
    70% { transform: translateX(4px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .star, .cloud, .scarecrow.shushing, .windmill.on .glyph { animation: none; }
    .windmill.shake { animation: none; background: #ffb3c6; }
  }
</style>
</head>

<body>
  <div class="scene" id="scene">
    <div class="sky">
      <div class="sky-layer morning" id="skyMorning"></div>
      <div class="sky-drag" id="skyDrag"></div>
      <div class="sky-layer day" id="skyDay"></div>
      <div class="sky-layer evening" id="skyEvening"></div>
      <div class="sky-layer night" id="skyNight"></div>

      <div class="stars" id="stars"></div>

      <div class="cloud c1">☁️</div>
      <div class="cloud c2">☁️</div>
      <div class="cloud c3">☁️</div>

      <div class="sun" id="sun"></div>
      <div class="moon" id="moon"></div>
    </div>

    <div class="farm-area">
      <div class="farm-grass"></div>
      <div class="night-veil" id="nightVeil"></div>

      <div class="field-panel">
        <div class="field" id="field"></div>
      </div>
    </div>

    <div class="farm-top-left">
      <div class="global-seed-picker" id="globalSeedPicker"></div>
    </div>

    <div class="scarecrow" id="scarecrow" title="点击静音">
      <div class="scarecrow-body">
        🎃
        <div class="tape-x"></div>
        <div class="mute-icon">🔇 已静音</div>
      </div>
    </div>

    <div class="yard" id="yard" hidden>
      <button class="yard-btn lamp" id="lamp" type="button" hidden title="点一下，亮度加 25%">
        <span class="glyph">💡</span>
        <span class="pct" id="lampPct">0</span>
      </button>
      <button class="yard-btn chicken" id="chicken" type="button" hidden title="麦克风静音">
        <span class="glyph">🐔</span>
      </button>
      <div class="radio" id="radio" hidden>
        <button type="button" data-media="previous" title="收音机：上一首">⏪</button>
        <button type="button" data-media="toggle" title="收音机：播放或暂停">▶︎</button>
        <button type="button" data-media="next" title="收音机：下一首">⏩</button>
      </div>
      <button class="yard-btn windmill" id="windmill" type="button" hidden title="风车管 Wi-Fi">
        <span class="glyph">💨</span>
      </button>
    </div>

    <div class="time-label" id="timeLabel">06:00 早晨</div>

    <div class="status-bar">
      <div class="status-item">
        <div class="status-dot"></div>
        <span id="volText">音量：0%</span>
      </div>
    </div>

    <button class="look-badge" id="lookBadge" type="button" hidden>🌤️ 浅色</button>

  </div>

<script>
  const TOTAL_PLOTS = 20;
  const scene = document.getElementById("scene");
  const sun = document.getElementById("sun");
  const moon = document.getElementById("moon");
  const stars = document.getElementById("stars");
  const field = document.getElementById("field");
  const scarecrow = document.getElementById("scarecrow");
  const volText = document.getElementById("volText");
  const timeLabel = document.getElementById("timeLabel");
  const globalSeedPicker = document.getElementById("globalSeedPicker");

  const skyMorning = document.getElementById("skyMorning");
  const skyDay = document.getElementById("skyDay");
  const skyEvening = document.getElementById("skyEvening");
  const skyNight = document.getElementById("skyNight");
  const nightVeil = document.getElementById("nightVeil");

  let muted = false;
  let plantedCount = 0;
  let currentSeedIndex = 0;
  let level = 0;
  const STEP = 5;

  const LOOKS = [
    { id: "light", icon: "🌤️", label: "浅色" },
    { id: "dark", icon: "🌙", label: "深色" },
    { id: "auto", icon: "🌗", label: "自动" }
  ];
  let look = "auto";
  let lookReady = false;
  const lookBadge = document.getElementById("lookBadge");

  const SEEDS = [
    { id: "carrot", icon: "🥕", label: "胡萝卜" },
    { id: "corn", icon: "🌽", label: "玉米" },
    { id: "tomato", icon: "🍅", label: "番茄" },
    { id: "eggplant", icon: "🍆", label: "茄子" },
    { id: "cabbage", icon: "🥬", label: "白菜" }
  ];

  // 一天 24 小时沿一条弧线走完：东升，正午到顶，西沉。
  // 18 点起太阳沉下去，月亮从弧线东端升起，接同一条轨迹。
  const ARC = { left: 6, right: 78, top: 3, bottom: 30 };
  const DAY_START = 6;
  const DAY_END = 18;
  // 8 点太阳在弧线东侧，21 点月亮在弧线西侧，天空已经全黑
  const DAY_PROGRESS = 8 / 24;
  const NIGHT_PROGRESS = 21 / 24;
  // auto 跟系统时间，day 和 night 固定在正午与深夜
  const MODES = ["auto", "day", "night"];
  let mode = "auto";
  let progress = 0;

  function clamp01(v) { return Math.max(0, Math.min(1, v)); }

  function arcPoint(t) {
    return {
      x: ARC.left + (ARC.right - ARC.left) * t,
      y: ARC.bottom - (ARC.bottom - ARC.top) * Math.sin(Math.PI * t),
    };
  }

  function place(el, t, visible) {
    const p = arcPoint(t);
    el.style.left = p.x + "%";
    el.style.top = p.y + "%";
    el.style.opacity = visible;
  }

  function updateSunByProgress(p) {
    progress = clamp01(p);
    const hour = progress * 24;
    const sunT = clamp01((hour - DAY_START) / (DAY_END - DAY_START));
    // 月亮比太阳晚 12 小时，走同一段弧
    // 18 点月亮在弧线西端接上太阳，凌晨再落到东端
    const moonT = clamp01(1 - ((hour + 6) % 24) / 12);
    place(sun, sunT, hour >= DAY_START && hour < DAY_END ? 1 : 0);
    place(moon, moonT, hour >= 18 || hour < DAY_START ? 1 : 0);
    updateTimeOfDay(progress);
  }

  function updateTimeOfDay(p) {
    const totalMin = Math.round(p * 24 * 60) % (24 * 60);
    const hour = Math.floor(totalMin / 60);
    const minute = totalMin % 60;
    const label = hour < 9 ? "早晨"
      : hour < 12 ? "上午"
      : hour < 14 ? "中午"
      : hour < 17 ? "下午"
      : hour < 19 ? "傍晚"
      : hour < 22 ? "夜晚"
      : "深夜";

    const clock = String(hour).padStart(2, "0") + ":" +
      String(minute).padStart(2, "0") + " " + label;
    timeLabel.textContent = mode === "auto" ? clock
      : mode === "day" ? "早晨" : "夜晚";

    updateSky(hour + minute / 60);
  }

  function fade(center, width, hour) {
    return clamp01(1 - Math.abs(hour - center) / width);
  }

  function updateSky(hour) {
    // 四个时段以钟点为中心，重叠处自然交叉，和标签用同一套时间
    const morningP = fade(7, 3, hour);
    const dayP = fade(13, 4, hour);
    const eveningP = fade(18.5, 2.5, hour);
    // 21 点起就算深夜，这样固定的夜晚状态是黑的，月亮仍在西边
    const nightP = hour >= 18 ? fade(24, 4, hour) : fade(0, 4, hour);

    skyMorning.style.opacity = morningP;
    skyDay.style.opacity = dayP;
    skyEvening.style.opacity = eveningP;
    skyNight.style.opacity = nightP;
    stars.style.opacity = nightP;
    // 只压暗草地和泥土，作物 emoji 不受影响
    nightVeil.style.opacity = String(nightP * 0.45);

    scene.classList.toggle("night-mode", nightP > 0.5);
  }

  // 点击天空在自动、早晨、夜晚之间轮换。自动每分钟重新读一次系统时间。
  const skyDrag = document.getElementById("skyDrag");

  function applyMode() {
    const p = mode === "day" ? DAY_PROGRESS
      : mode === "night" ? NIGHT_PROGRESS
      : progressFromClock();
    updateSunByProgress(p);
  }

  skyDrag.addEventListener("click", () => {
    mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
    applyMode();
  });

  setInterval(() => { if (mode === "auto") applyMode(); }, 60 * 1000);

  function renderSeedPicker() {
    globalSeedPicker.innerHTML = "";
    SEEDS.forEach((seed, index) => {
      const option = document.createElement("div");
      option.className = "seed-option" + (index === currentSeedIndex ? " selected" : "");
      option.textContent = seed.icon;
      option.title = seed.label;
      option.addEventListener("click", (e) => {
        e.stopPropagation();
        currentSeedIndex = index;
        renderSeedPicker();
      });
      globalSeedPicker.appendChild(option);
    });
  }

  function plant(plot, icon) {
    plot.dataset.planted = "1";
    plot.classList.add("planted");
    plot.querySelector(".crop-display").textContent = icon;
  }

  function clearPlot(plot) {
    plot.dataset.planted = "0";
    plot.classList.remove("planted");
    plot.querySelector(".crop-display").textContent = "";
  }

  function initField() {
    for (let i = 0; i < TOTAL_PLOTS; i++) {
      const plot = document.createElement("div");
      plot.className = "plot";
      plot.dataset.planted = "0";
      const cropDisplay = document.createElement("div");
      cropDisplay.className = "crop-display";
      plot.appendChild(cropDisplay);
      plot.addEventListener("click", () => {
        const next = level + (plot.dataset.planted === "0" ? STEP : -STEP);
        if (next < 0 || next > 100) return;
        if (plot.dataset.planted === "0") {
          plant(plot, SEEDS[currentSeedIndex].icon);
          plantedCount += 1;
        } else {
          clearPlot(plot);
          plantedCount -= 1;
        }
        level = next;
        if (muted && level > 0) setMuted(false);
        updateVolume();
        writeVolume(level);
      });
      field.appendChild(plot);
    }
  }

  function updateVolume() {
    volText.textContent = muted ? "音量：静音" : "音量：" + level + "%";
  }

  function initStars() {
    for (let i = 0; i < 40; i++) {
      const star = document.createElement("div");
      star.className = "star";
      const size = Math.random() * 3 + 1;
      star.style.width = size + "px";
      star.style.height = size + "px";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 45 + "%";
      star.style.animationDelay = Math.random() * 2 + "s";
      star.style.animationDuration = (Math.random() * 1.5 + 1.5) + "s";
      stars.appendChild(star);
    }
  }

  function setMuted(next) {
    muted = next;
    scarecrow.classList.toggle("muted", muted);
    updateVolume();
  }

  scarecrow.addEventListener("click", () => {
    setMuted(!muted);
    scarecrow.classList.remove("shushing");
    void scarecrow.offsetWidth;
    scarecrow.classList.add("shushing");
    writeMute(muted);
  });

  function progressFromClock() {
    const now = new Date();
    return (now.getHours() * 60 + now.getMinutes()) / (24 * 60);
  }

  // 音量桥。没有 Control 时（浏览器里直接打开）只改页面，不报错。
  const bridge = () => window.Control;
  const settle = (p) => Promise.resolve(p).catch((err) => console.error(err));

  function writeVolume(value) {
    const c = bridge();
    if (c) settle(c.setVolume(value));
  }

  function writeMute(value) {
    const c = bridge();
    if (c) settle(c.setMute(value));
  }

  function showLook() {
    const item = LOOKS.find((row) => row.id === look) || LOOKS[0];
    lookBadge.textContent = item.icon + " " + item.label;
    lookBadge.hidden = !lookReady;
  }

  function writeLook(value) {
    const c = bridge();
    if (c) settle(c.setControl("appearance", { selected: value }));
  }

  const lamp = document.getElementById("lamp");
  const lampPct = document.getElementById("lampPct");
  const chicken = document.getElementById("chicken");
  const radio = document.getElementById("radio");
  const windmill = document.getElementById("windmill");
  const yard = document.getElementById("yard");

  let bright = 0;
  let brightReady = false;
  let micMuted = false;
  let micReady = false;
  let wifiOn = false;
  let wifiReady = false;

  function showLamp() {
    lamp.hidden = !brightReady;
    lamp.style.setProperty("--glow", (bright / 100).toFixed(2));
    lampPct.textContent = String(bright);
    lamp.title = "亮度 " + bright + "%，点一下加 25%";
  }

  function showChicken() {
    chicken.hidden = !micReady;
    chicken.classList.toggle("muted", micMuted);
    chicken.title = micMuted ? "麦克风已静音" : "麦克风开着";
  }

  function showWind() {
    windmill.hidden = !wifiReady;
    windmill.classList.toggle("on", wifiOn);
    windmill.title = wifiOn ? "Wi-Fi 开着" : "Wi-Fi 关着";
  }

  function showYard() {
    yard.hidden = lamp.hidden && chicken.hidden && radio.hidden && windmill.hidden;
  }

  function writeBright(value) {
    const c = bridge();
    if (c) settle(c.setBrightness(value));
  }

  lamp.addEventListener("click", () => {
    if (!brightReady) return;
    bright = (Math.floor(bright / 25) * 25 + 25) % 125;
    showLamp();
    writeBright(bright);
  });

  chicken.addEventListener("click", () => {
    if (!micReady) return;
    micMuted = !micMuted;
    showChicken();
    const c = bridge();
    if (!c) return;
    settle(c.setControl("input.level", { muted: micMuted }).catch(() => {
      micMuted = !micMuted;
      showChicken();
    }));
  });

  radio.addEventListener("click", (event) => {
    const key = event.target.dataset && event.target.dataset.media;
    if (!key) return;
    event.target.classList.add("tap");
    setTimeout(() => event.target.classList.remove("tap"), 160);
    const c = bridge();
    if (c) settle(c.setControl("media." + key, {}));
  });

  windmill.addEventListener("click", () => {
    if (!wifiReady) return;
    const next = !wifiOn;
    const c = bridge();
    if (!c) {
      wifiOn = next;
      showWind();
      return;
    }
    settle(c.setControl("wifi.power", { on: next }).then(() => {
      wifiOn = next;
      showWind();
    }, () => {
      windmill.classList.remove("shake");
      void windmill.offsetWidth;
      windmill.classList.add("shake");
    }));
  });

  lookBadge.addEventListener("click", () => {
    if (!lookReady) return;
    const at = LOOKS.findIndex((row) => row.id === look);
    look = LOOKS[(at + 1) % LOOKS.length].id;
    showLook();
    writeLook(look);
  });

  // 系统音量变了（键盘、另一台设备）就重排田块，让作物数重新对上音量。
  // 亮度键走同一条事件，灯跟着变。
  window.events?.stateChanged.on((change) => {
    if (change.source !== "external") return;
    if (typeof change.volume === "number") applyLevel(change.volume);
    if (typeof change.brightness === "number" && brightReady) {
      bright = Math.max(0, Math.min(100, Math.round(change.brightness)));
      showLamp();
    }
  });

  function applyLevel(value) {
    const next = Math.max(0, Math.min(100, Math.round(value)));
    if (muted) {
      if (next === 0) return;
      setMuted(false);
    }
    if (next === level) return;
    const all = [...field.querySelectorAll(".plot")];
    const want = Math.round(next / STEP);
    while (plantedCount < want) {
      const plot = all.find((p) => p.dataset.planted === "0");
      if (!plot) break;
      plant(plot, SEEDS[currentSeedIndex].icon);
      plantedCount += 1;
    }
    while (plantedCount > want) {
      const plot = all.findLast((p) => p.dataset.planted === "1");
      if (!plot) break;
      clearPlot(plot);
      plantedCount -= 1;
    }
    level = next;
    updateVolume();
  }

  async function boot() {
    const c = bridge();
    if (c) {
      try {
        const state = await c.getState();
        level = Math.max(0, Math.min(100, Math.round(state.volume)));
        if (state.brightnessAvailable) {
          bright = Math.max(0, Math.min(100, Math.round(state.brightness)));
          brightReady = true;
        }
        const listed = await c.listControls();
        const byId = (id) => (listed || []).find((item) => item.id === id);
        const lookRow = byId("appearance");
        if (lookRow && lookRow.available && LOOKS.some((item) => item.id === lookRow.selected)) {
          look = lookRow.selected;
          lookReady = true;
        }
        const mic = byId("input.level");
        if (mic && mic.available) {
          micMuted = !!mic.muted;
          micReady = true;
        }
        const wifi = byId("wifi.power");
        if (wifi && wifi.available) {
          wifiOn = !!wifi.on;
          wifiReady = true;
        }
        radio.hidden = !["previous", "toggle", "next"].every((key) => {
          const row = byId("media." + key);
          return row && row.available;
        });
      } catch (err) {
        console.error(err);
      }
    }
    // 浏览器里直接打开没有桥，四项都露出来，只改页面。
    if (!bridge()) {
      lookReady = true;
      brightReady = true;
      micReady = true;
      wifiReady = true;
      wifiOn = true;
      radio.hidden = false;
    }
    showLook();
    showLamp();
    showChicken();
    showWind();
    showYard();
    renderSeedPicker();
    initField();
    initStars();
    applyMode();
    const start = level;
    level = -1;
    applyLevel(start);
  }

  boot();
</script>
</body>
</html>
